<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trustworthy AI as an Algorithmic Problem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap">
<style>
:root{--page:#e6eaf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#05080f}}
:root[data-theme="dark"]{--page:#05080f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.slide{position:relative;overflow:hidden;width:min(100%,1100px);aspect-ratio:16/9;min-height:460px;color:#eaf2ff;
 background:radial-gradient(900px 500px at 85% 40%,#12486b 0%,transparent 60%),radial-gradient(700px 400px at 0% 100%,#3b1d6e 0%,transparent 60%),#0a1224;
 padding:clamp(22px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%)}
svg.art{position:absolute;right:1%;top:50%;transform:translateY(-50%);width:56%;height:auto;max-height:92%}
.txt{position:relative;max-width:min(46%,520px)}
.badge{display:inline-block;font-size:clamp(.7rem,1.3vw,.9rem);padding:.35rem .8rem;border:1px solid #4fd1ff;color:#8fe3ff;border-radius:999px;background:rgba(79,209,255,.08);margin-bottom:1.1rem}
h1{margin:0;font-size:clamp(1.9rem,5.2vw,4rem);line-height:1.04;font-weight:700;letter-spacing:-.025em}
h1 span{background:linear-gradient(90deg,#4fd1ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:1rem 0 0;font-size:clamp(.9rem,1.9vw,1.25rem);color:#aebfdc;line-height:1.45}
.foot{position:relative;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font-size:clamp(.7rem,1.3vw,.9rem);padding:.4rem .75rem;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#d6e2f7}
.meta{font-size:clamp(.7rem,1.3vw,.9rem);color:#8193b3}
.tree line{stroke:#5b8bd6;stroke-opacity:.4;stroke-width:1}
.tree circle{fill:#0a1224;stroke:#4fd1ff;stroke-width:1.6}
.hot{fill:none;stroke:#ff5d73;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;animation:draw 2.4s .4s ease-out backwards;filter:drop-shadow(0 0 4px #ff5d73)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.cap{fill:#8fe3ff;font-size:14px;font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}
@media (max-width:680px){.slide{aspect-ratio:auto;min-height:600px}.txt{max-width:100%}svg.art{width:125%;right:-30%;top:64%;opacity:.4}}
</style>
</head>
<body>
<section class="slide">
  <div class="grid"></div>
  <svg class="art" viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A recursion tree doubling to 64 leaves, one path leading to a shield">
    <defs>
      <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#4fd1ff" stop-opacity=".4"/><stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="300" cy="230" r="230" fill="url(#glow)"/>
    <g class="tree" id="t"></g>
    <path class="hot" id="h" pathLength="1"/>
    <g id="s" opacity="0">
      <circle r="38" fill="url(#glow)"/>
      <path d="M0-28L22-18V6C22 20 11 30 0 35C-11 30-22 20-22 6V-18Z" fill="#0a1224" stroke="url(#sh)" stroke-width="3"/>
      <path d="M-9 4L-2 11L11-8" fill="none" stroke="url(#sh)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="cap" x="12" y="492">2ⁿ paths to check, one that must hold</text>
  </svg>
  <div class="txt">
    <span class="badge">Design and Analysis of Algorithms</span>
    <h1>Trustworthy AI as an <span>algorithmic problem</span></h1>
    <p class="sub">Fairness, explainability, robustness and privacy, and the computational price of each.</p>
  </div>
  <div class="foot">
    <div class="chips">
      <span class="chip">Verification is NP-complete</span>
      <span class="chip">Shapley values cost 2ⁿ</span>
    </div>
    <span class="meta">Gauhati University</span>
  </div>
</section>
<script>
(function(){
  var D=6,W=400,H=430,x0=14,n=Math.pow(2,D),step=W/D,leaf=0,path=[0,1,1,0,1,0],pts=[],lines="",dots="";
  function build(l,hot){
    var x=x0+l*step;
    if(l===D){return{x:x,y:20+(leaf++)*(H/(n-1))};}
    var a=build(l+1,hot&&path[l]===0),b=build(l+1,hot&&path[l]===1),y=(a.y+b.y)/2;
    lines+='<line x1="'+x+'" y1="'+y+'" x2="'+a.x+'" y2="'+a.y+'"/><line x1="'+x+'" y1="'+y+'" x2="'+b.x+'" y2="'+b.y+'"/>';
    dots+='<circle cx="'+x+'" cy="'+y+'" r="'+(l<2?5:3)+'"/>';
    if(hot){pts[l]={x:x,y:y,a:a,b:b};}
    return{x:x,y:y};
  }
  build(0,true);
  var d="M"+pts[0].x+" "+pts[0].y,end=null;
  for(var l=0;l<D;l++){end=path[l]===0?pts[l].a:pts[l].b;d+=" L"+end.x+" "+end.y;}
  document.getElementById("t").innerHTML=lines+dots;
  document.getElementById("h").setAttribute("d",d);
  var s=document.getElementById("s");
  s.setAttribute("transform","translate("+(end.x+62)+" "+end.y+")");
  s.setAttribute("opacity","1");
})();
</script>
</body>
</html>
